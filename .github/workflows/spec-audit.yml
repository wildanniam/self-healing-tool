name: Specification and offline runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: "0"
      OPENSPEC_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:audit

      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:presentation
      - run: npm run test:consumer
      - run: npm run test:lifecycle
      - run: npm run demo:offline

  compatibility:
    name: Node ${{ matrix.node }} · Playwright ${{ matrix.playwright }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        # Lowest supported version and the newest 1.x release.
        playwright: ["1.62.1", "1"]
    env:
      CONSUMER_PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:consumer
      - run: npm run test:lifecycle
